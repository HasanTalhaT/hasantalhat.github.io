<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hasan Talha Tetik - Ana Sayfa</title>
    <link rel="stylesheet" type="text/css" href="css.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Rowdies:wght@300;400;700&display=swap" rel="stylesheet">
</head>
<body>
    <!-- Navigation -->
    <nav class="navbar">
        <div class="nav-container">
            <h1 class="logo">HASAN TALHA TETIK</h1>
            <ul class="nav-menu">
                <li><a href="index.html" class="nav-link active">Ana Sayfa</a></li>
                <li><a href="dosyalar.html" class="nav-link">Dosyalar</a></li>
            </ul>
        </div>
    </nav>

    <!-- Hero Section -->
    <section class="hero">
        <div class="hero-content">
            <div class="hero-text">
                <h2 class="hero-title">Merhaba!</h2>
                <h3 class="hero-subtitle">Ben Hasan!</h3>
                <p class="hero-description">Hoş geldiniz! Sitemi keşfetmeye başlayın.</p>
                <a href="dosyalar.html" class="btn-primary">Dosyaları Gör</a>
            </div>
            
            <!-- Interactive Image -->
            <div class="hero-image">
                <img src="HASO.png" alt="Hasan" class="profile-img" id="hasoImage">
                <audio id="hasoAudio" src="ördek.mp3"></audio>
            </div>
        </div>
    </section>

    <!-- Video Section -->
    <section class="video-section">
        <div class="container">
            <h2 class="section-title">Video</h2>
            <div class="video-wrapper">
                <video id="video" class="responsive-video" controls>
                    <source src="deve.mp4" type="video/mp4">
                    Tarayıcınız video etiketini desteklemiyor.
                </video>
                <div class="video-controls">
                    <button id="playBtn" class="btn-control">▶ Oynat</button>
                    <button id="pauseBtn" class="btn-control">⏸ Duraklat</button>
                </div>
            </div>
        </div>
    </section>

    <!-- Snow Effect Container -->
    <div id="snow-container"></div>

    <!-- Nyan Cat -->
    <div class="nyan-cat">
        <img src="nyan-cat.gif" alt="Nyan Cat">
    </div>

    <!-- Fireworks Container -->
    <div id="fireworks-container"></div>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/fireworks-js@2.1.0/dist/fireworks.umd.js"></script>
    <script src="js.js"></script>
</body>
</html>
